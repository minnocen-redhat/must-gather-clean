# Profile for cleaning a must-gather while keeping obfuscated values
# reversible in support responses.
#
# This is an example profile, not a complete sanitization policy. Review it
# for the must-gather being shared and keep the standard sensitive-resource
# omissions below unless the support workflow explicitly requires otherwise.
# It uses only the built-in consistent obfuscators supported by the
# deobfuscation workflow.
config:
  obfuscate:
    - type: IP
      replacementType: Consistent
      target: All
    - type: MAC
      replacementType: Consistent
      target: All
    - type: Domain
      replacementType: Consistent
      target: All
      domainNames:
        - "rhcloud.com"
        - "dev.rhcloud.com"
    - type: AzureResources
      replacementType: Consistent
      target: All
  omit:
    - type: Kubernetes
      kubernetesResource:
        kind: "Secret"
    - type: Kubernetes
      kubernetesResource:
        kind: "ConfigMap"
    - type: Kubernetes
      kubernetesResource:
        kind: CertificateSigningRequest
        apiVersion: certificates.k8s.io/v1
    - type: Kubernetes
      kubernetesResource:
        kind: CertificateSigningRequestList
        apiVersion: certificates.k8s.io/v1
    - type: Kubernetes
      kubernetesResource:
        kind: MachineConfig
        apiVersion: machineconfiguration.openshift.io/v1
  randSeed: 1
